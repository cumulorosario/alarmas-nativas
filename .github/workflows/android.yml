name: Vigia Industrial — Build Android

# Se ejecuta a mano desde la pestaña "Actions" del repositorio,
# eligiendo si querés el APK de debug o el AAB de release.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qué compilar"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ inputs.tipo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El gradle-wrapper.jar del repositorio no coincide con ninguno oficial,
      # así que no lo usamos: leemos qué versión de Gradle pide el proyecto
      # y la instalamos directamente desde Gradle.
      - name: Leer la versión de Gradle del proyecto
        id: gradle_version
        run: |
          VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
            | sed -E 's/.*gradle-([0-9.]+(-rc-[0-9]+)?)-(bin|all)\.zip.*/\1/')
          echo "Versión de Gradle: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Instalar Gradle (con caché para compilar más rápido)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}
          validate-wrappers: false

      - name: Borrar archivos basura
        run: |
          find . -name "desktop.ini" -delete
          find . -name "Thumbs.db" -delete
          find . -name ".DS_Store" -delete
          rm -rf app/src/main/res/values-v27
          echo "Cleanup done"

      - name: Compilar APK de debug
        if: ${{ inputs.tipo == 'debug' }}
        run: |
          gradle assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            --no-daemon \
            --stacktrace

      - name: Compilar AAB de release
        if: ${{ inputs.tipo == 'release' }}
        run: |
          gradle bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            --no-daemon \
            --stacktrace

      - name: Guardar el APK de debug
        if: ${{ inputs.tipo == 'debug' }}
        uses: actions/upload-artifact@v5
        with:
          name: vigia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar el AAB de release
        if: ${{ inputs.tipo == 'release' }}
        uses: actions/upload-artifact@v5
        with:
          name: vigia-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
