name: Vigia Industrial — Build Android

# Se ejecuta a mano desde la pestaña "Actions" del repositorio,
# eligiendo si querés el APK de debug o el AAB de release.
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qué compilar"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ inputs.tipo }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (con caché para compilar más rápido)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al Gradle wrapper
        run: chmod +x gradlew

      - name: Borrar archivos basura
        run: |
          find . -name "desktop.ini" -delete
          find . -name "Thumbs.db" -delete
          find . -name ".DS_Store" -delete
          rm -rf app/src/main/res/values-v27
          echo "Cleanup done"

      - name: Compilar APK de debug
        if: ${{ inputs.tipo == 'debug' }}
        run: |
          ./gradlew assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            --no-daemon \
            --stacktrace

      - name: Compilar AAB de release
        if: ${{ inputs.tipo == 'release' }}
        run: |
          ./gradlew bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            --no-daemon \
            --stacktrace

      - name: Guardar el APK de debug
        if: ${{ inputs.tipo == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: vigia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar el AAB de release
        if: ${{ inputs.tipo == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: vigia-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
